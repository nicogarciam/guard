<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUARD - Panel de Control MQTT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <svg style="display: none;">
        <defs>
            <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
        </defs>
    </svg>

    <header>
        <div class="header-title">
            <svg viewBox="0 0 24 24">
                <path
                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
            </svg>
            <span>GUARD MONITOR</span>
        </div>
        <div id="connection-status" class="status-badge status-disconnected">
            <span class="status-dot"></span>
            <span id="status-text">Desconectado</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Panel de Configuración e Interacción -->
        <div class="panel">

            <!-- Configuración MQTT -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                    <span>Configuración Broker</span>
                </div>

                <div class="form-group">
                    <label for="broker-host">Host de Broker (WSS)</label>
                    <input type="text" id="broker-host" value="2d2715a472da427cb5a4b346706179af.s1.eu.hivemq.cloud">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="broker-port">Puerto</label>
                        <input type="number" id="broker-port" value="8884">
                    </div>
                    <div class="form-group">
                        <label for="broker-path">Path WebSocket</label>
                        <input type="text" id="broker-path" value="/mqtt">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="broker-user">Usuario</label>
                        <input type="text" id="broker-user" value="rpi_porton">
                    </div>
                    <div class="form-group">
                        <label for="broker-pass">Contraseña</label>
                        <input type="password" id="broker-pass" value="Guard123qwe">
                    </div>
                </div>

                <div class="form-group">
                    <label for="client-id">Client ID</label>
                    <input type="text" id="client-id" value="guard_web_client_">
                </div>

                <button id="btn-connect" class="btn-primary">
                    <svg style="width:1.15rem;height:1.15rem;fill:currentColor;" viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.12 0 2.07-.76 2.36-1.81 1.76 1.48 2.97 3.61 3.18 6.02.04.59-.11 1.17-.64 1.72z" />
                    </svg>
                    Conectar
                </button>
            </div>

            <!-- Acciones Rápidas -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                    </svg>
                    <span>Comandos y Acciones Rápidas</span>
                </div>

                <div class="quick-actions-container">
                    <button id="btn-open-gate" class="btn-quick" disabled>
                        <svg style="width:1.25rem;height:1.25rem;fill:currentColor;" viewBox="0 0 24 24">
                            <path
                                d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6-5c1.66 0 3 1.34 3 3v2H9V6c0-1.66 1.34-3 3-3zm6 17H6V10h12v10z" />
                        </svg>
                        Simular "Abrir Portón"
                    </button>
                </div>
            </div>

            <!-- Enviar Mensaje Personalizado -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                    <span>Publicar Mensaje</span>
                </div>

                <div class="form-group">
                    <label for="publish-topic">Tópico</label>
                    <select id="publish-topic">
                        <option value="mi_porton/comando">mi_porton/comando</option>
                        <option value="mi_porton/estado">mi_porton/estado</option>
                        <option value="mi_porton/evento">mi_porton/evento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="publish-payload">Cuerpo del Mensaje (JSON)</label>
                    <textarea id="publish-payload"
                        rows="5">{"event": "MANUAL_TRIGGER", "dsc": "Prueba desde cliente web", "timestamp": ""}</textarea>
                </div>

                <button id="btn-publish" class="btn-secondary" disabled>
                    Publicar Mensaje
                </button>
            </div>

        </div>

        <!-- Panel de Visualización y Filtros -->
        <div class="logs-container">

            <!-- Barra de Filtros -->
            <div class="filter-bar">
                <div class="filter-group" style="flex: 2 1 350px;">
                    <label>Filtrar por Tópico</label>
                    <div id="topic-filters-container" class="topic-filters-list">
                        <button type="button" class="topic-filter-btn active" data-topic="mi_porton/comando">
                            <span class="checkbox-indicator"></span>
                            mi_porton/comando
                        </button>
                        <button type="button" class="topic-filter-btn active" data-topic="mi_porton/estado">
                            <span class="checkbox-indicator"></span>
                            mi_porton/estado
                        </button>
                        <button type="button" class="topic-filter-btn active" data-topic="mi_porton/evento">
                            <span class="checkbox-indicator"></span>
                            mi_porton/evento
                        </button>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="filter-search">Buscar en Mensaje</label>
                    <input type="text" id="filter-search" placeholder="Contenido o evento...">
                </div>

                <div class="filter-actions">
                    <button id="btn-clear" class="btn-danger">
                        <svg style="width:1.15rem;height:1.15rem;fill:currentColor;" viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                        </svg>
                        Limpiar Historial
                    </button>
                </div>
            </div>

            <!-- Listado de Mensajes -->
            <div class="messages-list-wrapper">
                <div class="list-header">
                    <span>HISTORIAL DE MENSAJES</span>
                    <span id="message-count">0 registrados</span>
                </div>

                <ul id="messages-ul" class="messages-list">
                    <!-- Mensajes dinámicos -->
                    <div class="no-messages" id="no-messages-view">
                        <svg viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <p>No se han recibido ni enviado mensajes aún.<br>Conéctate al broker para empezar.</p>
                    </div>
                </ul>
            </div>

        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
